<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Your Vitrine verification code</title>

  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->

  <style>
    :root {
      color-scheme: light dark;
      supported-color-schemes: light dark;
    }

    body, table, td, a {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }

    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }

    img {
      -ms-interpolation-mode: bicubic;
      border: 0;
      height: auto;
      line-height: 100%;
      outline: none;
      text-decoration: none;
    }

    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      background-color: #EFEFE7;
    }

    .email-body {
      background-color: #EFEFE7;
    }

    .email-card {
      background-color: #FFFFFF;
    }

    .heading-text {
      color: #0C0C10;
    }

    .body-text {
      color: #0C0C10;
    }

    .muted-text {
      color: #6B6B65;
    }

    .footer-text {
      color: #6B6B65;
    }

    .code-block {
      background-color: #0C0C10 !important;
    }

    .code-text {
      color: #D3FFC3 !important;
    }

    @media (prefers-color-scheme: dark) {
      body, .email-body {
        background-color: #0C0C10 !important;
      }

      .email-card {
        background-color: #1A1A1E !important;
      }

      .heading-text {
        color: #EFEFE7 !important;
      }

      .body-text {
        color: #EFEFE7 !important;
      }

      .muted-text {
        color: #9B9B95 !important;
      }

      .footer-text {
        color: #9B9B95 !important;
      }

      .logo-light {
        display: none !important;
        max-height: 0 !important;
        overflow: hidden !important;
      }

      .logo-dark {
        display: block !important;
        max-height: none !important;
        overflow: visible !important;
      }
    }

    /* Outlook.com web dark mode */
    [data-ogsc] .email-body,
    [data-ogsb] .email-body {
      background-color: #0C0C10 !important;
    }

    [data-ogsc] .email-card,
    [data-ogsb] .email-card {
      background-color: #1A1A1E !important;
    }

    [data-ogsc] .heading-text,
    [data-ogsb] .heading-text {
      color: #EFEFE7 !important;
    }

    [data-ogsc] .body-text,
    [data-ogsb] .body-text {
      color: #EFEFE7 !important;
    }

    [data-ogsc] .muted-text,
    [data-ogsb] .muted-text,
    [data-ogsc] .footer-text,
    [data-ogsb] .footer-text {
      color: #9B9B95 !important;
    }

    [data-ogsc] .code-block,
    [data-ogsb] .code-block {
      background-color: #0C0C10 !important;
    }

    [data-ogsc] .code-text,
    [data-ogsb] .code-text {
      color: #D3FFC3 !important;
    }

    [data-ogsc] .logo-light,
    [data-ogsb] .logo-light {
      display: none !important;
      max-height: 0 !important;
      overflow: hidden !important;
    }

    [data-ogsc] .logo-dark,
    [data-ogsb] .logo-dark {
      display: block !important;
      max-height: none !important;
      overflow: visible !important;
    }
  </style>
</head>

<body style="margin: 0; padding: 0; background-color: #EFEFE7;">

  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" class="email-body" bgcolor="#EFEFE7" style="background-color: #EFEFE7;">
    <tr>
      <td align="center" style="padding: 40px 16px;">

        <!-- Card container -->
        <table role="presentation" cellpadding="0" cellspacing="0" width="480" class="email-card" bgcolor="#FFFFFF" style="background-color: #FFFFFF; border-radius: 12px; max-width: 480px; width: 100%;">

          <!-- Accent bar -->
          <tr>
            <td style="font-size: 0; line-height: 0; height: 4px; border-radius: 12px 12px 0 0;" bgcolor="#D3FFC3">
              <!--[if mso]>
              <v:rect xmlns:v="urn:schemas-microsoft-com:vml" style="width:480px;height:4px;" stroked="false">
                <v:fill type="tile" color="#D3FFC3"/>
              </v:rect>
              <![endif]-->
              <!--[if !mso]><!--><div style="height: 4px; background-color: #D3FFC3; border-radius: 12px 12px 0 0;"></div><!--<![endif]-->
            </td>
          </tr>

          <!-- Logo -->
          <tr>
            <td align="center" style="padding: 40px 40px 0 40px;">
              <!--[if mso]>
              <img src="https://fxmiongkckkrllgyfwyw.supabase.co/storage/v1/object/public/brand-assets/logos/wordmark_dark.png" alt="Vitrine" width="140" style="display:block;width:140px;height:auto;">
              <![endif]-->
              <!--[if !mso]><!-->
              <img
                src="https://fxmiongkckkrllgyfwyw.supabase.co/storage/v1/object/public/brand-assets/logos/wordmark_dark.png"
                alt="Vitrine"
                width="140"
                class="logo-light"
                style="display: block; width: 140px; height: auto;"
              >
              <div class="logo-dark" style="display: none; max-height: 0; overflow: hidden; font-size: 0; line-height: 0;">
                <img
                  src="https://fxmiongkckkrllgyfwyw.supabase.co/storage/v1/object/public/brand-assets/logos/wordmark_light.png"
                  alt="Vitrine"
                  width="140"
                  style="display: block; width: 140px; height: auto;"
                >
              </div>
              <!--<![endif]-->
            </td>
          </tr>

          <!-- Heading -->
          <tr>
            <td align="center" style="padding: 32px 40px 0 40px;">
              <h1 class="heading-text" style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 600; line-height: 1.3; color: #0C0C10;">
                Your verification code
              </h1>
            </td>
          </tr>

          <!-- Code block -->
          <tr>
            <td align="center" style="padding: 28px 40px 0 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center" class="code-block" style="border-radius: 10px;">
                    <!--[if mso]>
                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" style="width:400px;height:72px;v-text-anchor:middle;" arcsize="14%" fillcolor="#0C0C10" stroked="false">
                      <v:fill type="tile" color="#0C0C10"/>
                      <w:anchorlock/>
                      <center>
                        <span style="font-family: 'Courier New', monospace; font-size: 36px; font-weight: 700; letter-spacing: 8px; color: #D3FFC3; mso-color-alt: windowtext;">{{ .Token }}</span>
                      </center>
                    </v:roundrect>
                    <![endif]-->
                    <!--[if !mso]><!-->
                    <div style="background-color: #0C0C10; border-radius: 10px; padding: 24px 20px; text-align: center;">
                      <span class="code-text" style="font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', 'Courier New', monospace; font-size: 36px; font-weight: 700; letter-spacing: 8px; line-height: 1; color: #D3FFC3 !important;">{{ .Token }}</span>
                    </div>
                    <!--<![endif]-->
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Instruction text -->
          <tr>
            <td align="center" style="padding: 28px 40px 0 40px;">
              <p class="body-text" style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.6; color: #0C0C10;">
                Enter this code in the app to continue.
              </p>
            </td>
          </tr>

          <!-- Expiry note -->
          <tr>
            <td align="center" style="padding: 8px 40px 0 40px;">
              <p class="muted-text" style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.5; color: #6B6B65;">
                This code expires in 10 minutes.
              </p>
            </td>
          </tr>

          <!-- Bottom padding -->
          <tr>
            <td style="padding: 40px 0 0 0; font-size: 0; line-height: 0;">&nbsp;</td>
          </tr>
        </table>

        <!-- Footer -->
        <table role="presentation" cellpadding="0" cellspacing="0" width="480" style="max-width: 480px; width: 100%;">
          <tr>
            <td align="center" style="padding: 24px 40px 0 40px;">
              <p class="footer-text" style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; line-height: 1.5; color: #6B6B65;">
                If you didn't request this code, you can safely ignore this email.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding: 16px 40px 0 40px;">
              <p class="footer-text" style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; line-height: 1.5; color: #6B6B65;">
                &copy; 2026 Vitrine
              </p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
